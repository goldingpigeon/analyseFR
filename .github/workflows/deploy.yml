name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Chemins relatifs : fonctionne quel que soit le nom du dépôt ou l'adresse du site.
          BASE_PATH: ./
          # Connexion via Supabase. Ces deux valeurs sont publiques par conception
          # (URL du projet + clé « publishable »). Une variable de dépôt du même nom les remplace.
          # Ne JAMAIS mettre ici une clé secrète (sb_secret_… / service_role).
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://qnbylltdtenhhriqugqd.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || 'sb_publishable_TxEWkaIyyBcYr-MZbNHZ1g_H4Ft0KJ1' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
